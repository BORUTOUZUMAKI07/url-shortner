name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# A scheduled run only reads the repo and uploads an artifact.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  # Not production — see the note in ci.yml.
  ENVIRONMENT: "test"
  SECRET_KEY: "test-secret-key-for-ci-0123456789abcdef"
  WEBHOOK_SECRET_KEY: "test-secret-key-for-ci-0123456789abcdef"

jobs:
  nightly-tests:
    name: Nightly Full Suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev --extra testcontainers

      # Rerun the blocking security gates nightly. A dependency ceiling can
      # resolve a new advisory on a fresh `uv sync` even when the last PR CI
      # was green, and without this the first signal would be a failed push.
      - name: Bandit (SAST, medium+)
        run: uv run bandit -c pyproject.toml -r src -q -ll
      - name: pip-audit (known advisories)
        run: uv run pip-audit -l --skip-editable

      - name: Run full test suite (incl. concurrency)
        shell: bash
        # `pytest | tee` reports tee's status unless pipefail is on. GitHub's
        # bash shell enables it, but set it explicitly so this cannot regress
        # if the shell default changes.
        run: |
          set -o pipefail
          uv run pytest tests/ -v --use-testcontainers 2>&1 | tee /tmp/nightly_output.log
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-log
          path: /tmp/nightly_output.log
      - uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend,nightly

  # A green suite does not prove the deployed service is up. Probe it daily so
  # a broken deploy or a degraded dependency surfaces without a push. Retries
  # absorb a cold Render start; only statuses are printed.
  deployed-smoke:
    name: Deployed Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production health
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL || 'https://linkforge-backend-v46v.onrender.com' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsS --max-time 60 "$SMOKE_BASE_URL/health" >/dev/null \
              && curl -fsS --max-time 60 "$SMOKE_BASE_URL/api/v1/ping" >/dev/null; then
              echo "deployed backend healthy (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt failed"
            sleep 15
          done
          echo "::error::deployed backend failed health probes after 3 attempts"
          exit 1
