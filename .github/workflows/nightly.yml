name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  nightly-tests:
    name: Nightly Full Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev --extra testcontainers
      - name: Run full test suite (incl. concurrency)
        run: uv run pytest tests/ -v --use-testcontainers 2>&1 | tee /tmp/nightly_output.log
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-log
          path: /tmp/nightly_output.log
      - uses: codecov/codecov-action@v7
        with:
          file: ./backend/coverage.xml
          flags: backend,nightly
