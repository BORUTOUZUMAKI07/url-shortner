name: CI

on:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  # CI is not production. Without this the settings default ("production")
  # applies, which refuses to boot on a placeholder SECRET_KEY and would mark
  # auth cookies Secure â€” breaking every plain-HTTP E2E request.
  ENVIRONMENT: "test"
  # PyJWT refuses an empty HMAC key. CI has no backend/.env, so set a
  # deterministic test key here as well as in tests/testcontainers.py.
  SECRET_KEY: "test-secret-key-for-ci-0123456789abcdef"
  WEBHOOK_SECRET_KEY: "test-secret-key-for-ci-0123456789abcdef"

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run mypy src/

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run lint

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev --extra testcontainers
      - name: Run tests against Docker testcontainers
        shell: bash
        run: |
          # Retry up to 3 times: GitHub shared runners occasionally race on
          # container startup. Genuine failures still fail after retries.
          log=/tmp/backend-tests.log
          for attempt in 1 2 3; do
            echo "== pytest attempt $attempt ==" | tee -a "$log"
            if uv run pytest tests/ -v --use-testcontainers 2>&1 | tee -a "$log"; then
              exit 0
            fi
          done
          exit 1
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-log
          path: /tmp/backend-tests.log

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-test]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Python security (bandit + pip-audit)
        working-directory: backend
        shell: bash
        run: |
          uv run pip install bandit pip-audit
          uv run bandit -r src/ --exit-zero || true
          uv run pip-audit || true
      - name: Node security (npm audit)
        working-directory: frontend
        shell: bash
        run: |
          npm audit --audit-level=high || true
      - name: Secret scan
        shell: bash
        run: |
          # Fail the job if any real secrets are committed.
          if grep -rE "(sk_live|AKIA|ghp_|github_pat_|glpat-)" \
             . --include="*.py" --include="*.ts" --include="*.tsx" \
             --include="*.env" --include="*.env.*" --include="*.json" \
             --include="*.yaml" --include="*.yml" 2>/dev/null; then
            echo "::error::Potential secrets found in tracked files"
            exit 1
          fi
          echo "No secrets detected"

  backend-e2e:
    name: Backend E2E (Real HTTP)
    runs-on: ubuntu-latest
    needs: [backend-test]
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev --extra testcontainers
      - name: Run backend E2E against Docker testcontainers
        shell: bash
        run: |
          # The server boots a subprocess + 3 containers; retry once for the
          # same GitHub-runner startup races the main suite handles.
          log=/tmp/backend-e2e.log
          for attempt in 1 2 3; do
            echo "== pytest tests/test_e2e attempt $attempt ==" | tee -a "$log"
            if uv run pytest tests/test_e2e -v --use-testcontainers 2>&1 | tee -a "$log"; then
              exit 0
            fi
          done
          exit 1
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-log
          path: /tmp/backend-e2e.log

  frontend-integration:
    name: Frontend Integration + E2E (Real Backend)
    runs-on: ubuntu-latest
    needs: [backend-e2e, frontend-build]
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend deps
        working-directory: backend
        run: uv sync --extra dev --extra testcontainers
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend against testcontainers
        working-directory: backend
        shell: bash
        run: |
          # Standalone server boot: testcontainers + alembic + uvicorn on :8000.
          nohup uv run python scripts/e2e_server.py > /tmp/e2e-backend.log 2>&1 &
          echo "backend pid: $!"
      - name: Wait for backend
        shell: bash
        run: |
          for i in $(seq 1 150); do
            if curl -sf http://127.0.0.1:8000/api/v1/ping >/dev/null 2>&1; then
              echo "backend ready after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become ready:"
          tail -200 /tmp/e2e-backend.log
          exit 1
      - name: Frontend integration tests (real backend)
        working-directory: frontend
        run: npm run test:integration
      - name: Frontend E2E (real backend)
        working-directory: frontend
        run: npm run test:e2e:real
      - name: Stop backend
        if: always()
        shell: bash
        # The background e2e_server keeps a `uv` process alive. setup-uv's
        # post-job cache prune then waits five minutes and fails the job even
        # though every test passed. Terminate it before the post action runs.
        run: |
          pkill -f "scripts/e2e_server.py" || true
          sleep 2
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-integration-logs
          path: /tmp/e2e-backend.log

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend-integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase repo
        shell: bash
        run: echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        shell: bash
        run: |
          docker buildx build \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/backend:latest \
            --push ./backend
      - name: Build and push frontend
        shell: bash
        run: |
          docker buildx build \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/frontend:latest \
            --push ./frontend
