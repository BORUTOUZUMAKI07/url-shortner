services:
  - type: web
    name: linkforge-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: sh start.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: linkforge_analytics
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_SSL_CA
        sync: false
      - key: SCHEMA_REGISTRY_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      # No `value:` on purpose. The collector's basicauth fallback is the dev
      # credential, so committing it here would pin a known password to a
      # public receiver. Left blank, Render prompts for the real Basic header;
      # if it is never set the app falls back to its config default (the same
      # dev credential) and warn_if_default_otlp_credential() says so at
      # startup — it still works, but it is no longer silent.
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false
      # Was missing entirely: email worked only because these had been added by
      # hand in the dashboard. A service created fresh from this file would have
      # had no mail at all, and nothing would have said so - EmailService logs
      # "Would send email to..." and returns.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: LinkForge
      # Security-audit batch. Both default to off, so leaving them unset is safe;
      # set ADMIN_BOOTSTRAP_TOKEN or /admin/seed stays 404 and there is no way to
      # create the first superadmin on a fresh database.
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      # Optional geo token (ipinfo.io/signup). Anonymous calls still work, but a
      # free token lifts the quota to 50k req/month. Geo is resolved async in the
      # analytics worker — never on the redirect hot path — is fail-open, and
      # each IP is cached for 24h, so leaving it unset is safe.
      - key: IPINFO_TOKEN
        sync: false

  # ── Layer-2: OpenTelemetry Collector (collection & transport) ──────────────
  # Public HTTPS :443 is proxied to $PORT (4318) — the OTLP/HTTP receiver the
  # backend pushes all three signals to. The agent tail-samples traces, batches,
  # and forwards to New Relic (Layer-3 sink) using NEW_RELIC_LICENSE_KEY. Free
  # plan: the instance sleeps after ~15 min of inactivity and cold-starts on the
  # next OTLP push (fail-open — the backend never blocks on telemetry, so a few
  # spans at wake-up are dropped by design). No Render health check: the agent's
  # /healthz lives on:13133, which Render can't reach through the single public
  # port. Basicauth is already ON (docker/otel-collector-config.yaml) — but
  # both sides fall back to the same shipped dev credential `linkforge:linkforge`
  # (the collector's `${env:...}` default, and the app's config default once
  # OTEL_EXPORTER_OTLP_HEADERS is left blank below), so while neither is
  # overridden anyone reading this repo can authenticate to the public receiver
  # and push junk (burning the NR free quota). Neither side commits a value
  # now — both are prompted. Before real traffic: set OTLP_HTTP_AUTH_HTPASSWD on
  # this service to an htpasswd entry (plaintext "user:pass" or bcrypt) and set
  # the backend's OTEL_EXPORTER_OTLP_HEADERS to
  # `Authorization=Basic <base64(user:pass)>` for the same pair. The backend
  # logs a startup warning while the shipped credential (or an empty header) is
  # paired with a non-local endpoint.
  - type: web
    name: linkforge-otel-collector
    runtime: docker
    region: oregon
    plan: free
    rootDir: docker
    dockerfilePath: otel-collector.Dockerfile
    envVars:
      - key: NEW_RELIC_LICENSE_KEY
        sync: false
      # Receiver credential (htpasswd entry). Prompted, never committed: the
      # config's `${env:OTLP_HTTP_AUTH_HTPASSWD:-linkforge:linkforge}` fallback
      # is a published dev password — fine on localhost, not on a public URL.
      # Must match the backend's OTEL_EXPORTER_OTLP_HEADERS Basic header.
      - key: OTLP_HTTP_AUTH_HTPASSWD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "4318"
