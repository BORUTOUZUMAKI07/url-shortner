services:
  - type: web
    name: linkforge-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: sh start.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: linkforge_analytics
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_SSL_CA
        sync: false
      - key: SCHEMA_REGISTRY_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false
      # Was missing entirely: email worked only because these had been added by
      # hand in the dashboard. A service created fresh from this file would have
      # had no mail at all, and nothing would have said so - EmailService logs
      # "Would send email to..." and returns.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: LinkForge
      # Security-audit batch. Both default to off, so leaving them unset is safe;
      # set ADMIN_BOOTSTRAP_TOKEN or /admin/seed stays 404 and there is no way to
      # create the first superadmin on a fresh database.
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"

  # ── Layer-2: OpenTelemetry Collector (collection & transport) ──────────────
  # Public HTTPS :443 is proxied to $PORT (4318) — the OTLP/HTTP receiver the
  # backend pushes all three signals to. The agent tail-samples traces, batches,
  # and forwards to New Relic (Layer-3 sink) using NEW_RELIC_LICENSE_KEY. Free
  # plan: the instance sleeps after ~15 min of inactivity and cold-starts on the
  # next OTLP push (fail-open — the backend never blocks on telemetry, so a few
  # spans at wake-up are dropped by design). No Render health check: the agent's
  # /healthz lives on:13133, which Render can't reach through the single public
  # port. Enable basicauth on the receiver (see docker/otel-collector-config.yaml)
  # before pointing real traffic at the public URL.
  - type: web
    name: linkforge-otel-collector
    runtime: docker
    region: oregon
    plan: free
    rootDir: docker
    dockerfilePath: otel-collector.Dockerfile
    envVars:
      - key: NEW_RELIC_LICENSE_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "4318"
