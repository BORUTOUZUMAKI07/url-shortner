services:
  # ── Data Stores ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: linkforge_postgres
    environment:
      POSTGRES_USER: linkforge_user
      POSTGRES_PASSWORD: linkforge_password
      POSTGRES_DB: linkforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkforge_user -d linkforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: linkforge_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: linkforge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # backend and the workers gate on `condition: service_healthy`, so without
    # this healthcheck compose waits forever and the whole stack never starts.
    # (postgres and mongodb already declare one.)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Event Bus ────────────────────────────────────────────
  kafka:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r11
    container_name: linkforge_kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: linkforge_redis_exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis

  # ── Admin UIs ────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: linkforge_kafka_ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-kraft
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - DYNAMIC_CONFIG_ENABLED=true

  schema-registry:
    image: bitnamilegacy/schema-registry:8.0.0-debian-12-r5
    container_name: linkforge_schema_registry
    ports:
      - "8081:8081"
    environment:
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_KAFKA_BROKERS=PLAINTEXT://kafka:9092
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
      - SCHEMA_REGISTRY_CLIENT_ID=schema-registry
      - SCHEMA_REGISTRY_GROUP_ID=schema-registry
      - SCHEMA_REGISTRY_MASTER_ELIGIBILITY=true
      - SCHEMA_REGISTRY_TOPIC_NAME=_schemas
    depends_on:
      - kafka

  # ── Observability (Layer 2: collection & transport) ──────
  # In-process OTel SDK (Layer 1) pushes metrics/traces/logs here over OTLP;
  # the agent tail-samples, batches, and forwards to New Relic (Layer 3) via
  # OTEL_EXPORTER_OTLP_ENDPOINT_HEADERS — the NR ingest key lives on the
  # agent, not the app. It also scrapes the app's /metrics to exercise the
  # scrape path (output is local/debug only — see otel-collector-config.yaml).
  #
  # Set the ingest key before starting (PowerShell):
  #   $env:NEW_RELIC_LICENSE_KEY = "xxxx"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: linkforge_otel_collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      # not-set keeps the config loadable without a key; NR export fails open.
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-not-set}
      - ENVIRONMENT=development
    ports:
      - "4317:4317"   # OTLP/gRPC (optional)
      - "4318:4318"   # OTLP/HTTP — what the app pushes to
      - "8888:8888"   # collector self-metrics
      - "13133:13133" # /healthz
    depends_on:
      - backend

  # ── Application ──────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: linkforge_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://linkforge_user:linkforge_password@postgres:5432/linkforge_db
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://admin:adminpassword@mongodb:27017
      - MONGODB_DB=linkforge_analytics
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FRONTEND_URL=http://localhost:3001
      - ENVIRONMENT=development
      # Layer-1 → Layer-2: push all three signals to the local collector.
      # The collector owns the New Relic API key (adds it as api-key header).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_HEADERS=
      # 1.0 = send every span; the collector tail-samples (keeps all errors).
      - OTEL_TRACES_SAMPLE_RATIO=1.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      otel-collector:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: linkforge_frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  # ── Workers ──────────────────────────────────────────────
  aggregation-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: linkforge_aggregation_worker
    command: python -m src.analytics.workers.aggregation_worker
    environment:
      - DATABASE_URL=postgresql://linkforge_user:linkforge_password@postgres:5432/linkforge_db
      - MONGODB_URI=mongodb://admin:adminpassword@mongodb:27017
      - MONGODB_DB=linkforge_analytics
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ENVIRONMENT=development
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started

  analytics-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: linkforge_analytics_worker
    command: python -m src.analytics.workers.analytics_worker
    environment:
      - DATABASE_URL=postgresql://linkforge_user:linkforge_password@postgres:5432/linkforge_db
      - MONGODB_URI=mongodb://admin:adminpassword@mongodb:27017
      - MONGODB_DB=linkforge_analytics
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ENVIRONMENT=development
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started

  webhook-retry-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: linkforge_webhook_retry_worker
    command: python -m src.webhooks.workers.webhook_retry_worker
    environment:
      - DATABASE_URL=postgresql://linkforge_user:linkforge_password@postgres:5432/linkforge_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ENVIRONMENT=development
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
